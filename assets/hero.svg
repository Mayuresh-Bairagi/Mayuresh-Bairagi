<svg width="860" height="290" viewBox="0 0 860 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes tw   { 0%,100%{opacity:.05} 50%{opacity:.95} }
      @keyframes sp   { from{transform:rotate(0deg)}   to{transform:rotate(360deg)}  }
      @keyframes spR  { from{transform:rotate(0deg)}   to{transform:rotate(-360deg)} }
      @keyframes cc   { 0%{fill:#00f7ff} 33%{fill:#a855f7} 66%{fill:#f472b6} 100%{fill:#00f7ff} }
      @keyframes fi   { from{opacity:0} to{opacity:1} }
      @keyframes nmg  { 0%,100%{opacity:.85} 50%{opacity:1} }
      @keyframes scan { 0%{transform:translateY(-290px);opacity:0} 8%{opacity:.18} 92%{opacity:.18} 100%{transform:translateY(290px);opacity:0} }
      @keyframes dp   { 0%,100%{opacity:.25} 50%{opacity:.65} }
      @keyframes bdp  { 0%,100%{opacity:.5} 50%{opacity:.9} }

      .star { animation:tw var(--d,3s) ease-in-out var(--t,0s) infinite; }
      .r1   { transform-origin:430px 145px; animation:sp  10s linear infinite; }
      .r2   { transform-origin:430px 145px; animation:spR 16s linear infinite; }
      .r3   { transform-origin:430px 145px; animation:sp  24s linear infinite; }
      .nmg  { animation:nmg 3.5s ease-in-out infinite; }
      .cc   { animation:cc 5s linear infinite; }
      .fi1  { opacity:0; animation:fi .5s ease .1s forwards; }
      .fi2  { opacity:0; animation:fi .5s ease .7s forwards; }
      .fi3  { opacity:0; animation:fi .5s ease 1.4s forwards; }
      .fi4  { opacity:0; animation:fi .5s ease 2.0s forwards; }
      .fi5  { opacity:0; animation:fi .5s ease 2.6s forwards; }
      .fi6  { opacity:0; animation:fi .5s ease 3.2s forwards; }
      .scan { animation:scan 6s linear .5s infinite; }
      .dp   { animation:dp 3s ease-in-out infinite; }
      .bdp  { animation:bdp 4s ease-in-out infinite; }
    </style>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0d1829"/>
    </linearGradient>
    <filter id="gs" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gm" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.7" fill="#1a3055" opacity="0.9"/>
    </pattern>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="860" height="290" fill="url(#bgG)"/>
  <rect width="860" height="290" fill="url(#dots)" opacity="0.7"/>

  <!-- Ambient glow blobs -->
  <circle cx="110" cy="85"  r="200" fill="#00f7ff" opacity="0.012" filter="url(#gl)"/>
  <circle cx="750" cy="205" r="175" fill="#a855f7" opacity="0.018" filter="url(#gl)"/>
  <circle cx="430" cy="145" r="90"  fill="#00f7ff" opacity="0.008" filter="url(#gl)"/>

  <!-- ── STARS ── -->
  <circle class="star" style="--d:2.3s;--t:0.1s" cx="42"  cy="18"  r="1.2" fill="#fff"/>
  <circle class="star" style="--d:3.1s;--t:0.7s" cx="132" cy="50"  r="0.9" fill="#fff"/>
  <circle class="star" style="--d:2.7s;--t:1.2s" cx="219" cy="13"  r="1.1" fill="#fff"/>
  <circle class="star" style="--d:3.5s;--t:0.4s" cx="302" cy="37"  r="0.7" fill="#fff"/>
  <circle class="star" style="--d:2.1s;--t:1.9s" cx="380" cy="8"   r="1.4" fill="#fff"/>
  <circle class="star" style="--d:3.8s;--t:0.6s" cx="462" cy="31"  r="0.9" fill="#fff"/>
  <circle class="star" style="--d:2.5s;--t:1.4s" cx="542" cy="15"  r="1.2" fill="#fff"/>
  <circle class="star" style="--d:3.3s;--t:0.2s" cx="618" cy="47"  r="0.8" fill="#fff"/>
  <circle class="star" style="--d:2.9s;--t:1.7s" cx="700" cy="21"  r="1.0" fill="#fff"/>
  <circle class="star" style="--d:2.6s;--t:0.9s" cx="784" cy="43"  r="1.3" fill="#fff"/>
  <circle class="star" style="--d:3.7s;--t:1.1s" cx="838" cy="11"  r="0.7" fill="#fff"/>
  <circle class="star" style="--d:2.4s;--t:0.5s" cx="76"  cy="82"  r="1.1" fill="#fff"/>
  <circle class="star" style="--d:3.2s;--t:1.8s" cx="192" cy="97"  r="0.8" fill="#fff"/>
  <circle class="star" style="--d:2.8s;--t:0.3s" cx="326" cy="89"  r="1.3" fill="#fff"/>
  <circle class="star" style="--d:3.6s;--t:1.5s" cx="480" cy="73"  r="0.9" fill="#fff"/>
  <circle class="star" style="--d:2.2s;--t:0.8s" cx="580" cy="92"  r="1.2" fill="#fff"/>
  <circle class="star" style="--d:3.4s;--t:1.3s" cx="727" cy="69"  r="1.0" fill="#fff"/>
  <circle class="star" style="--d:2.9s;--t:0.6s" cx="824" cy="87"  r="0.6" fill="#fff"/>
  <circle class="star" style="--d:3.1s;--t:1.6s" cx="24"  cy="156" r="0.9" fill="#fff"/>
  <circle class="star" style="--d:2.5s;--t:0.4s" cx="110" cy="194" r="1.1" fill="#fff"/>
  <circle class="star" style="--d:3.9s;--t:1.9s" cx="244" cy="173" r="0.7" fill="#fff"/>
  <circle class="star" style="--d:2.3s;--t:0.7s" cx="636" cy="197" r="1.2" fill="#fff"/>
  <circle class="star" style="--d:3.3s;--t:1.4s" cx="762" cy="175" r="0.8" fill="#fff"/>
  <circle class="star" style="--d:2.8s;--t:0.9s" cx="850" cy="194" r="1.0" fill="#fff"/>
  <circle class="star" style="--d:3.0s;--t:1.7s" cx="58"  cy="252" r="1.3" fill="#fff"/>
  <circle class="star" style="--d:2.6s;--t:0.5s" cx="178" cy="265" r="0.7" fill="#fff"/>
  <circle class="star" style="--d:3.7s;--t:1.2s" cx="422" cy="255" r="1.1" fill="#fff"/>
  <circle class="star" style="--d:2.4s;--t:0.3s" cx="684" cy="261" r="0.9" fill="#fff"/>
  <circle class="star" style="--d:3.2s;--t:1.6s" cx="816" cy="250" r="1.2" fill="#fff"/>

  <!-- ── SCAN LINE ── -->
  <rect class="scan" x="0" y="0" width="860" height="1.5" fill="#00f7ff"/>

  <!-- ── CORNER DECORATIONS ── -->
  <!-- Top-left -->
  <g class="fi1" filter="url(#gs)" stroke="#00f7ff" stroke-width="1.8" fill="none">
    <path d="M20,58 L20,18 L60,18"/>
  </g>
  <circle class="fi1" cx="20" cy="18" r="3.5" fill="#00f7ff" filter="url(#gs)"/>
  <!-- Top-right -->
  <g class="fi1" filter="url(#gs)" stroke="#00f7ff" stroke-width="1.8" fill="none">
    <path d="M840,58 L840,18 L800,18"/>
  </g>
  <circle class="fi1" cx="840" cy="18" r="3.5" fill="#00f7ff" filter="url(#gs)"/>
  <!-- Bottom-left -->
  <g class="fi1" filter="url(#gs)" stroke="#00f7ff" stroke-width="1.8" fill="none">
    <path d="M20,232 L20,272 L60,272"/>
  </g>
  <circle class="fi1" cx="20" cy="272" r="3.5" fill="#00f7ff" filter="url(#gs)"/>
  <!-- Bottom-right -->
  <g class="fi1" filter="url(#gs)" stroke="#00f7ff" stroke-width="1.8" fill="none">
    <path d="M840,232 L840,272 L800,272"/>
  </g>
  <circle class="fi1" cx="840" cy="272" r="3.5" fill="#00f7ff" filter="url(#gs)"/>

  <!-- Decorative thin lines from corners -->
  <g class="fi2" stroke="#1e3f6a" stroke-width="0.5" fill="none" opacity="0.6">
    <line x1="68" y1="18" x2="215" y2="18"/>
    <line x1="645" y1="18" x2="792" y2="18"/>
    <line x1="68" y1="272" x2="215" y2="272"/>
    <line x1="645" y1="272" x2="792" y2="272"/>
    <line x1="20" y1="66" x2="20" y2="120"/>
    <line x1="840" y1="66" x2="840" y2="120"/>
    <line x1="20" y1="170" x2="20" y2="224"/>
    <line x1="840" y1="170" x2="840" y2="224"/>
  </g>

  <!-- ── ORBITAL RINGS (centered 430, 145) ── -->
  <!-- Outer ring (CW) -->
  <g class="r1 fi2">
    <ellipse cx="430" cy="145" rx="190" ry="30" fill="none" stroke="#00f7ff" stroke-width="0.8" stroke-dasharray="5 12" opacity="0.35"/>
    <circle cx="620" cy="145" r="3.5" fill="#00f7ff" filter="url(#gs)" opacity="0.9"/>
  </g>
  <!-- Middle ring (CCW) -->
  <g class="r2 fi2">
    <ellipse cx="430" cy="145" rx="148" ry="22" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 10" opacity="0.3"/>
    <circle cx="282" cy="145" r="2.5" fill="#a855f7" filter="url(#gs)" opacity="0.9"/>
  </g>
  <!-- Inner ring hint (CW slow) -->
  <g class="r3 fi2">
    <ellipse cx="430" cy="145" rx="236" ry="40" fill="none" stroke="#f472b6" stroke-width="0.5" stroke-dasharray="2 16" opacity="0.18"/>
  </g>

  <!-- ── MAIN CONTENT ── -->
  <!-- Init prompt -->
  <text class="fi2" x="430" y="92" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="12" fill="#00f7ff" opacity="0.85"
        filter="url(#gs)">&gt; init mayuresh.ai ...</text>

  <!-- Name glow layer (blur) -->
  <text class="fi3 nmg" x="430" y="148" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="50" font-weight="900"
        letter-spacing="5" fill="#00f7ff" filter="url(#gm)" opacity="0.45">MAYURESH BAIRAGI</text>
  <!-- Name sharp layer -->
  <text class="fi3 nmg" x="430" y="148" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="50" font-weight="900"
        letter-spacing="5" fill="#ffffff">MAYURESH BAIRAGI</text>

  <!-- Subtitle -->
  <text class="fi4 cc" x="430" y="178" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="2">
    AI Systems Engineer • RAG | MCP | GenAI
  </text>

  <!-- Divider -->
  <line class="fi4" x1="295" y1="193" x2="565" y2="193" stroke="#1e3f6a" stroke-width="0.8"/>

  <!-- Tagline -->
  <text class="fi5" x="430" y="216" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="12" fill="#565f89">
    <tspan fill="#9ece6a">&lt;/</tspan>
    <tspan fill="#c0caf5"> Building intelligent systems, one prompt at a time </tspan>
    <tspan fill="#9ece6a">/&gt;</tspan>
  </text>

  <!-- Status row -->
  <g class="fi6" font-family="'Courier New',Courier,monospace" font-size="11">
    <circle cx="302" cy="244" r="4" fill="#9ece6a" filter="url(#gs)"/>
    <text x="313" y="248" fill="#9ece6a">available</text>
    <circle cx="384" cy="244" r="4" fill="#e0af68" filter="url(#gs)"/>
    <text x="395" y="248" fill="#e0af68">building</text>
    <circle cx="458" cy="244" r="4" fill="#7aa2f7" filter="url(#gs)"/>
    <text x="469" y="248" fill="#7aa2f7">open_to_collab</text>
  </g>
</svg>
