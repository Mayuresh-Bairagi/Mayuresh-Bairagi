  <defs>
    <style>
      @keyframes appear  { from{opacity:0} to{opacity:1} }
      @keyframes bgl     { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes bscale  { from{transform:scaleX(0)} to{transform:scaleX(1)} }
      @keyframes blk     { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      .a   { opacity:0; animation:appear .35s ease forwards; }
      .bdr { animation:bgl 4s ease-in-out infinite; }
      .cur { opacity:0; animation:blk .85s step-end 7.5s infinite; }

      /* ── LEFT COL skill bars (track x=170, bar h=10) ── */
      .sk-py { transform-origin:170px 157px; animation:bscale 1.1s ease-out 2.4s both; }
      .sk-fa { transform-origin:170px 175px; animation:bscale 1.1s ease-out 2.7s both; }
      .sk-lc { transform-origin:170px 193px; animation:bscale 1.1s ease-out 3.0s both; }
      .sk-rg { transform-origin:170px 211px; animation:bscale 1.1s ease-out 3.3s both; }
      .sk-mc { transform-origin:170px 229px; animation:bscale 1.1s ease-out 3.6s both; }
      .sk-cd { transform-origin:170px 247px; animation:bscale 1.1s ease-out 3.9s both; }

      /* ── RIGHT COL metric bars (track x=615, bar h=10) ── */
      .mt-ar { transform-origin:615px 177px; animation:bscale 1.0s ease-out 2.4s both; }
      .mt-ud { transform-origin:615px 195px; animation:bscale 1.0s ease-out 2.7s both; }
      .mt-em { transform-origin:615px 213px; animation:bscale 1.0s ease-out 3.0s both; }
      .mt-ex { transform-origin:615px 231px; animation:bscale 1.0s ease-out 3.3s both; }
    </style>

    <filter id="gs" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gbdr" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
