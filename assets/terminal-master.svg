<svg width="860" height="710" viewBox="0 0 860 710" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ── core appear animation ── */
      @keyframes appear  { from{opacity:0} to{opacity:1} }
      /* ── border glow pulse ── */
      @keyframes bgl     { 0%,100%{opacity:.55} 50%{opacity:1} }
      /* ── skill / metric bars (scaleX 0→1) ── */
      @keyframes bscale  { from{transform:scaleX(0)} to{transform:scaleX(1)} }
      /* ── blinking cursor ── */
      @keyframes blk     { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      /* apply appear with individual delays via style attribute */
      .a   { opacity:0; animation:appear .35s ease forwards; }
      /* border glow */
      .bdr { animation:bgl 4s ease-in-out infinite; }
      /* cursor */
      .cur { opacity:0; animation:blk .85s step-end 13s infinite; }

      /* ── skill bars ── */
      /* track: x=200, width=320; bar center-y = track_y + 5 */
      .sk-py { transform-origin:200px 158px; animation:bscale 1.1s ease-out 2.7s both; }
      .sk-fa { transform-origin:200px 178px; animation:bscale 1.1s ease-out 3.1s both; }
      .sk-lc { transform-origin:200px 198px; animation:bscale 1.1s ease-out 3.5s both; }
      .sk-rg { transform-origin:200px 218px; animation:bscale 1.1s ease-out 3.9s both; }
      .sk-mc { transform-origin:200px 238px; animation:bscale 1.1s ease-out 4.3s both; }
      .sk-cd { transform-origin:200px 258px; animation:bscale 1.1s ease-out 4.7s both; }

      /* ── metric bars ── */
      /* track: x=215, width=220; bar center-y = track_y + 5 */
      .mt-ar { transform-origin:215px 427px; animation:bscale 1.0s ease-out 8.1s both; }
      .mt-ud { transform-origin:215px 445px; animation:bscale 1.0s ease-out 8.4s both; }
      .mt-em { transform-origin:215px 463px; animation:bscale 1.0s ease-out 8.7s both; }
      .mt-ex { transform-origin:215px 481px; animation:bscale 1.0s ease-out 9.0s both; }
    </style>

    <filter id="gs" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gbdr" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ── NEON GLOW BEHIND BORDER ── -->
  <rect class="bdr" x="1" y="1" width="858" height="708" rx="14"
        fill="none" stroke="#00f7ff" stroke-width="2.5"
        filter="url(#gbdr)" opacity="0.6"/>

  <!-- ── WINDOW BACKGROUND ── -->
  <rect width="860" height="710" rx="12" fill="#0d1117" stroke="#00f7ff" stroke-width="1" opacity="0.9"/>

